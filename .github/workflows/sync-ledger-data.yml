# Copies Ballot305's public data (repo Brittybrit/vote-informed, public) into public/ledger-data/ so the ledger API
# serves the platform's own copy. Phase 1 of public/docs/decisions/0008-ledger-moves-to-platform.md.
# Commits to main only when a data file changed. No deploy step: Brit decides deploys.
name: sync ledger data
on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-ledger-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: wethepeople }
      - uses: actions/checkout@v4
        with: { repository: Brittybrit/vote-informed, ref: main, path: vote-informed, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync-ballot305-data.mjs ../vote-informed
        working-directory: wethepeople
      - name: Commit when the data changed
        working-directory: wethepeople
        run: |
          git add public/ledger-data
          if git diff --cached --quiet; then echo "No data change."; exit 0; fi
          sha=$(git -C ../vote-informed rev-parse --short HEAD)
          git -c user.name="ledger-sync bot" -c user.email="ledger-sync-bot@users.noreply.github.com" commit -m "Ledger data from Ballot305 at $sha"
          git pull --rebase origin main
          git push origin HEAD:main
