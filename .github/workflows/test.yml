name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Prompt evals run when a key is present (repo secret ANTHROPIC_API_KEY). Cached model outputs are restored so
      # unchanged prompts cost nothing; a prompt change or model swap re-runs only what changed.
      - uses: actions/cache@v4
        with: { path: .cache, key: "evals-${{ hashFiles('prompts/**', 'config/models.json') }}", restore-keys: evals- }
      - if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: pnpm eval
